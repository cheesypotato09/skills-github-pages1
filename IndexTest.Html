<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model with AI Integration</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd3d3d3);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const light = new THREE.AmbientLight(0xffffff, 2);
        scene.add(light);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Load Model
        let model;
        const loader = new THREE.GLTFLoader();
        loader.load(
            "body.glb",
            function (gltf) {
                model = gltf.scene;
                scene.add(model);
                console.log("Model Loaded!");

                // Compute Bounding Box and Centering
                const bbox = new THREE.Box3().setFromObject(model);
                const boundingBoxCenter = bbox.getCenter(new THREE.Vector3());

                console.log("Bounding Box Center:", boundingBoxCenter);

                // Move model to center
                model.position.sub(boundingBoxCenter);

                // Adjust Camera Position
                const boundingSphere = bbox.getBoundingSphere(new THREE.Sphere());
                camera.position.set(0, boundingSphere.radius, boundingSphere.radius * 2);
                camera.lookAt(scene.position);

                // Add spheres at correct locations
                addSphereAtCoordinate(new THREE.Vector3(-0.1684, 0.2443, -0.0273), "Right IT Band");
                addSphereAtCoordinate(new THREE.Vector3(0.1636, 0.1768, -0.0483), "Left IT Band");
                addSphereAtCoordinate(new THREE.Vector3(-0.1698, 0.5387, -0.0385), "Right Oblique");
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + "% loaded");
            },
            function (error) {
                console.error("Error loading model:", error);
            }
        );

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Raycasting for Click Detection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Dictionary for Marked Points
        const bodyParts = {
            "Right IT Band": new THREE.Vector3(-0.1684, 0.2443, -0.0273),
            "Left IT Band": new THREE.Vector3(0.1636, 0.1768, -0.0483),
            "Right Oblique": new THREE.Vector3(-0.1698, 0.5387, -0.0385),
        };

        // Add spheres at predefined points
        function addSphereAtCoordinate(position, partName) {
            const geometry = new THREE.SphereGeometry(0.02, 16, 16); // Small sphere
            const material = new THREE.MeshBasicMaterial({ color: 0x0000ff }); // Blue
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(position);
            sphere.name = partName;
            scene.add(sphere);
        }

        // Mouse Click Event Listener
        window.addEventListener("click", function(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const clickedPoint = intersects[0].point;
                console.log("Clicked at:", clickedPoint);

                let closestPart = null;
                let minDistance = 0.05; // Threshold distance

                for (let part in bodyParts) {
                    const distance = clickedPoint.distanceTo(bodyParts[part]);
                    if (distance < minDistance) {
                        closestPart = part;
                        minDistance = distance;
                    }
                }

                if (closestPart) {
                    console.log(`Clicked on: ${closestPart}`);
                    sendToBackend(closestPart);
                }
            }
        });

        // Send Data to AI Backend
        function sendToBackend(bodyPart) {
            fetch('http://localhost:5000/ask-ai-chat', {  // Replace with your actual API endpoint
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userMessage: `Give me stretches for this ${bodyPart} in less than 200 words` }),
            })
            .then(response => response.json())
            .then(data => {
                console.log('AI Response:', data.response);
                alert(data.response); // Display response
            })
            .catch(error => console.error('Error:', error));
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
